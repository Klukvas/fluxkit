name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual run (Actions -> CI -> Run workflow) for the `visual` job against the chosen base branch. Note: it runs EVERY job of
  # this workflow (the full feature matrix, e2e, deploy smoke, ...), and the concurrency group below cancels an in-progress
  # run on the same ref.
  workflow_dispatch:
    inputs:
      base:
        description: Base branch of the visual comparison (job `visual`)
        default: main
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  # Throwaway credentials for ephemeral CI service containers only.
  DATABASE_URL: postgres://fluxkit:ci-postgres@localhost:5432/fluxkit_test
  REDIS_URL: redis://localhost:6379
  MEILI_URL: http://localhost:7700
  MEILI_MASTER_KEY: ci-meili-master-key-0123456789
  # Throwaway secret for the API processes that CI starts (feature matrix); the test suite supplies its own.
  ORDER_TOKEN_SECRET: ci-order-token-secret-0123456789-abcdef

jobs:
  verify:
    name: Lint, types, boundaries, tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fluxkit
          POSTGRES_PASSWORD: ci-postgres
          POSTGRES_DB: fluxkit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fluxkit -d fluxkit_test" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      meilisearch:
        image: getmeili/meilisearch:v1.55.0
        env:
          MEILI_ENV: development
          MEILI_MASTER_KEY: ci-meili-master-key-0123456789
          MEILI_NO_ANALYTICS: "true"
        ports: ["7700:7700"]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wait for Meilisearch
        run: |
          for _ in $(seq 1 60); do
            curl -fsS "$MEILI_URL/health" && exit 0
            sleep 1
          done
          echo "Meilisearch did not become healthy" >&2
          exit 1
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - name: Schema drift (Drizzle schema vs committed migrations)
        run: pnpm --filter @fluxkit/api db:drift
      - run: pnpm check:boundaries
      - run: pnpm check:env
      - run: pnpm test

  feature-matrix:
    name: Feature matrix (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode:
          [
            on,
            off,
            deleted,
            providers-on,
            providers-off,
            providers-deleted,
            providers-nova-post,
            providers-email-fake,
            providers-email-none,
            providers-email-resend,
            providers-payment-fake,
            providers-payment-none,
            providers-payment-monobank,
            search-on,
            search-off,
          ]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fluxkit
          POSTGRES_PASSWORD: ci-postgres
          POSTGRES_DB: fluxkit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fluxkit -d fluxkit_test" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      meilisearch:
        image: getmeili/meilisearch:v1.55.0
        env:
          MEILI_ENV: development
          MEILI_MASTER_KEY: ci-meili-master-key-0123456789
          MEILI_NO_ANALYTICS: "true"
        ports: ["7700:7700"]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wait for Meilisearch
        run: |
          for _ in $(seq 1 60); do
            curl -fsS "$MEILI_URL/health" && exit 0
            sleep 1
          done
          echo "Meilisearch did not become healthy" >&2
          exit 1
      - run: bash scripts/feature-matrix.sh ${{ matrix.mode }}

  e2e:
    name: End-to-end (Playwright, Chromium)
    runs-on: ubuntu-latest
    # The default run, then the blog scenarios of both suites with the feature on.
    timeout-minutes: 45
    env:
      # Both suites (storefront, then admin) WIPE this database at the start of their run (apps/storefront/e2e/README.md,
      # apps/admin/e2e/README.md): a dedicated one, never the verify job's.
      E2E_DATABASE_URL: postgres://fluxkit:ci-postgres@localhost:5432/fluxkit_e2e_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fluxkit
          POSTGRES_PASSWORD: ci-postgres
          POSTGRES_DB: fluxkit_e2e_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fluxkit -d fluxkit_e2e_test" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      meilisearch:
        image: getmeili/meilisearch:v1.55.0
        env:
          MEILI_ENV: development
          MEILI_MASTER_KEY: ci-meili-master-key-0123456789
          MEILI_NO_ANALYTICS: "true"
        ports: ["7700:7700"]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wait for Meilisearch
        run: |
          for _ in $(seq 1 60); do
            curl -fsS "$MEILI_URL/health" && exit 0
            sleep 1
          done
          echo "Meilisearch did not become healthy" >&2
          exit 1
      - run: pnpm build
      # Chromium only, the browser revision that belongs to the pinned @playwright/test (no cache: a restored browser of
      # another revision would be a silent mismatch; the download is a few seconds). The admin suite pins the same
      # version, so this one browser serves both suites.
      - name: Install Chromium
        run: pnpm --filter @fluxkit/storefront exec playwright install --with-deps chromium
      # The storefront suite, then the admin suite; the first failure stops the step and pnpm names the failing package.
      # The default run is the template's (no feature): it also checks the blog switched off (blog-off.e2e.ts, blog.e2e.ts).
      - run: pnpm test:e2e
      # The optional blog (ADR 0049) switched on: each suite again with its API on FEATURES_ENABLED=blog (and the blog's
      # migration), its blog files only (the other files are written for the template without a feature link in the header).
      # Both wipe E2E_DATABASE_URL at their start like the default run.
      - name: Storefront blog scenarios (E2E_FEATURES=blog)
        env:
          E2E_FEATURES: blog
        run: pnpm --filter @fluxkit/storefront test:e2e blog
      - name: Admin blog scenarios (ADMIN_E2E_FEATURES=blog)
        env:
          ADMIN_E2E_FEATURES: blog
        run: pnpm --filter @fluxkit/admin test:e2e blog
      - name: Upload the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/storefront/playwright-report
            apps/storefront/test-results
            apps/admin/playwright-report
            apps/admin/test-results
          retention-days: 7

  policy:
    name: Licenses, audit, notices
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:licenses
      - name: Audit production dependencies (fails on high severity)
        run: pnpm run audit:prod
      - name: Audit all dependencies (report only)
        run: pnpm audit --audit-level=moderate || true
      - run: pnpm notices
      - uses: actions/upload-artifact@v7
        with:
          name: third-party-notices
          path: third-party/THIRD_PARTY_NOTICES.md

  docs:
    name: Docs are updated with the code
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-docs.mjs --base origin/${{ github.base_ref }}

  compose:
    name: Docker Compose stack starts healthy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: docker compose --env-file .env -f infra/docker-compose.yml up -d --wait --wait-timeout 180
      - run: docker compose --env-file .env -f infra/docker-compose.yml ps
      - if: failure()
        run: |
          docker compose --env-file .env -f infra/docker-compose.yml logs
          docker compose --env-file .env -f infra/docker-compose.yml ps -a
          docker compose --env-file .env -f infra/docker-compose.yml exec -T meilisearch sh -c 'which wget curl; wget -S -O- http://127.0.0.1:7700/health' || true
      - if: always()
        run: docker compose --env-file .env -f infra/docker-compose.yml down -v

  deploy-smoke:
    name: Production images and Compose example (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      # Builds the api, storefront and edge targets of the root Dockerfile (nothing is pushed), starts
      # infra/docker-compose.prod.yml with a throwaway env file and a self-signed certificate, checks routing, headers,
      # TLS, the webhook route, an upload and the per-client rate limit through the edge, then removes everything.
      - run: bash scripts/deploy-smoke.sh

  # Visual comparison of the storefront (plan docs/plans/2026-11-08-design-changeability.md, section 7;
  # apps/storefront/e2e/README.md, "Visual comparison"). Two builds and two runs of the stack: too slow for every PR, so a
  # cheap gate decides first. It runs for a PR labelled `visual-check` (the label is read at the PR's next push), for a PR that
  # changes the theme, the UI library, the storefront's source or the harness itself, and on a manual run of this workflow.
  visual-gate:
    name: Visual comparison needed?
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'visual-check') }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$LABELLED" = "true" ]; then
            echo "run=true" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          pattern='^(packages/theme/|packages/ui/|apps/storefront/src/|apps/storefront/public/|apps/storefront/postcss\.config\.mjs$|apps/storefront/next\.config\.ts$|apps/storefront/e2e/support/env\.ts$|\.visual/exceptions\.json$|apps/storefront/e2e/visual\.config\.ts$|apps/storefront/e2e/tests/[^/]+\.visual\.ts$|apps/storefront/e2e/support/visual/|scripts/visual-compare\.sh$)'
          if printf '%s\n' "$changed" | grep -Eq "$pattern"; then run=true; else run=false; fi
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"

  visual:
    name: Visual comparison (computed styles, screenshots)
    needs: visual-gate
    if: needs.visual-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Each visual run WIPES this database at its start, like the e2e suite (apps/storefront/e2e/README.md).
      E2E_DATABASE_URL: postgres://fluxkit:ci-postgres@localhost:5432/fluxkit_e2e_test
      VISUAL_BASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.base || github.base_ref }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fluxkit
          POSTGRES_PASSWORD: ci-postgres
          POSTGRES_DB: fluxkit_e2e_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fluxkit -d fluxkit_e2e_test" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      meilisearch:
        image: getmeili/meilisearch:v1.55.0
        env:
          MEILI_ENV: development
          MEILI_MASTER_KEY: ci-meili-master-key-0123456789
          MEILI_NO_ANALYTICS: "true"
        ports: ["7700:7700"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests of the visual harness
        run: pnpm --filter @fluxkit/storefront exec vitest run -c e2e/support/visual/vitest.config.ts
      - name: Wait for Meilisearch
        run: |
          for _ in $(seq 1 60); do
            curl -fsS "$MEILI_URL/health" && exit 0
            sleep 1
          done
          echo "Meilisearch did not become healthy" >&2
          exit 1
      - name: Install Chromium
        run: pnpm --filter @fluxkit/storefront exec playwright install --with-deps chromium
      # Builds the merge-base and this tree and records both on this machine; the verdicts are the next two steps. Exit 2
      # (the harness itself failed: a build, a page that does not render, an invalid exceptions file) fails this step.
      - name: Compare the base and this tree
        run: |
          code=0
          bash scripts/visual-compare.sh "origin/$VISUAL_BASE_REF" --strict || code=$?
          echo "visual-compare.sh exited with $code"
          [ "$code" -ne 2 ]
      - name: Computed styles (mandatory, zero tolerance, declared exceptions only)
        if: always()
        run: |
          if [ -f .visual/report/computed-styles.txt ]; then cat .visual/report/computed-styles.txt; fi
          status="$(cat .visual/report/computed-styles.status 2>/dev/null || echo missing)"
          echo "computed styles: $status"
          [ "$status" = "pass" ]
      - name: Screenshots (maxDiffPixels 0; diff images in the visual-report artifact)
        if: always()
        run: |
          status="$(cat .visual/report/screenshots.status 2>/dev/null || echo missing)"
          echo "screenshots: $status"
          [ "$status" = "pass" ]
      - name: Upload the visual report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-report
          path: .visual/report
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Upload both snapshot sets
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-snapshots
          path: |
            .visual/baseline
            .visual/current
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
