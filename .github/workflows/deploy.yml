name: Deploy

# Builds the production images of a commit on main that passed CI, pushes them to Docker Hub and deploys them to one host over
# SSH (docs/deployment.md, "Automatic deployment"; plan docs/plans/2026-11-12-deploy-workflow.md). Nothing about the host is in
# the repository: it comes from repository variables and secrets. Without the variable DEPLOY_HOST every job is skipped, so the
# template and forks without a host see a skipped run, not a failure.
#
# Variables: DOCKERHUB_USERNAME, DEPLOY_HOST, DEPLOY_KNOWN_HOSTS (the host's public keys, `ssh-keyscan` output, checked),
# optional DEPLOY_USER (default root), DEPLOY_PORT (default 22), DEPLOY_PUBLIC_URL (checked after the deployment),
# STOREFRONT_IMAGE_HOSTS and STOREFRONT_REQUIRE_LEGAL_TEXT (storefront build arguments, see the Dockerfile).
# Secrets: DOCKERHUB_TOKEN (Docker Hub access token, read and write), DEPLOY_SSH_KEY (private key whose authorized_keys line on
# the host forces infra/deploy/fluxkit-deploy).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Redeploy, or move to another commit on main (Actions -> Deploy -> Run workflow).
  workflow_dispatch:
    inputs:
      sha:
        description: Commit on main to deploy (empty = the head of main)
        required: false
        default: ""

permissions:
  contents: read

# One deployment at a time; a newer pending one replaces an older pending one, a running one is never cancelled.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  images:
    name: Build and push images
    # Only after a successful CI run of a push to main in this repository (never a pull request's run), or by hand.
    if: >-
      vars.DEPLOY_HOST != '' && (github.event_name == 'workflow_dispatch' || (
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE_PREFIX: ${{ vars.DOCKERHUB_USERNAME }}/fluxkit
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.sha || 'main' }}
          # Full history, to check that the commit is on main.
          fetch-depth: 0
      - name: Release commit
        id: release
        run: |
          sha=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$sha is not on main"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=${sha:0:7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # `context: .` builds the checked-out commit (the action's default would be the workflow's own ref). The three targets
      # share the `build` stage; each writes its own cache scope and reads all three.
      - name: api image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: api
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-api:${{ steps.release.outputs.tag }}
          cache-from: |
            type=gha,scope=deploy-api
            type=gha,scope=deploy-storefront
            type=gha,scope=deploy-edge
          cache-to: type=gha,scope=deploy-api,mode=max
      - name: storefront image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: storefront
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-storefront:${{ steps.release.outputs.tag }}
          build-args: |
            STOREFRONT_IMAGE_HOSTS=${{ vars.STOREFRONT_IMAGE_HOSTS }}
            STOREFRONT_REQUIRE_LEGAL_TEXT=${{ vars.STOREFRONT_REQUIRE_LEGAL_TEXT }}
          cache-from: |
            type=gha,scope=deploy-api
            type=gha,scope=deploy-storefront
            type=gha,scope=deploy-edge
          cache-to: type=gha,scope=deploy-storefront,mode=max
      - name: edge image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: edge
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-edge:${{ steps.release.outputs.tag }}
          cache-from: |
            type=gha,scope=deploy-api
            type=gha,scope=deploy-storefront
            type=gha,scope=deploy-edge
          cache-to: type=gha,scope=deploy-edge,mode=max

  deploy:
    name: Deploy to the host
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.DEPLOY_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.images.outputs.sha }}
      - name: SSH key and pinned host key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::error::set the secret DEPLOY_SSH_KEY and the variable DEPLOY_KNOWN_HOSTS"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          (umask 077 && printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key)
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      # The host runs infra/deploy/fluxkit-deploy (forced command): it reads "deploy <sha>" and this commit's infra/ on stdin.
      - name: Deploy
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          RELEASE_SHA: ${{ needs.images.outputs.sha }}
        run: |
          git archive --format=tar "$RELEASE_SHA" infra |
            ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
              -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
              "$DEPLOY_USER@$DEPLOY_HOST" deploy "$RELEASE_SHA"
      - name: Check the public site
        if: vars.DEPLOY_PUBLIC_URL != ''
        env:
          DEPLOY_PUBLIC_URL: ${{ vars.DEPLOY_PUBLIC_URL }}
        run: |
          curl -fsS --retry 6 --retry-delay 5 --retry-all-errors -o /dev/null "$DEPLOY_PUBLIC_URL/store/config"
          curl -fsSL --retry 6 --retry-delay 5 --retry-all-errors -o /dev/null "$DEPLOY_PUBLIC_URL/"
          echo "$DEPLOY_PUBLIC_URL answers"
      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
