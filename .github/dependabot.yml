version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # TypeScript is pinned to 6.0.3 until typescript-eslint and dependency-cruiser support 7 (AGENTS.md, ADR 0003).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      # Nest packages must move together: every workspace package that imports @nestjs/common pins the API's exact
      # version (apps/api/src/common/workspace-runtime-dependencies.spec.ts), so one-package bumps always fail.
      nestjs:
        patterns: ["@nestjs/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /infra
    schedule:
      interval: weekly
  # The base images of the production Dockerfile (node, nginx-unprivileged; pinned by digest).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
