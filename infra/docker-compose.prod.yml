# Production example: one host, one shop (docs/deployment.md). Not the development stack (that is docker-compose.yml).
#   cp infra/production.env.example infra/production.env      # fill in; never commit it
#   docker compose --env-file infra/production.env -f infra/docker-compose.prod.yml build
#   docker compose --env-file infra/production.env -f infra/docker-compose.prod.yml up -d --wait
# Services: postgres, migrate (runs the pending migrations, then exits), api (also runs the scheduler), storefront, edge
# (nginx: TLS, routing, the admin SPA), meilisearch (catalog search, ADR 0034), redis (shared state for several API instances,
# docs/plans/2026-11-14-multi-instance.md; used with RATE_LIMIT_STORE=redis). Only the edge publishes ports.
# More than one api replica needs RATE_LIMIT_STORE=redis; infra/deploy/fluxkit-deploy enforces it.
# Postgres, Meilisearch and Redis are pinned by tag and digest: every deploy pulls the project, and a moved tag would otherwise
# recreate the database or Redis inside an application release. Updates arrive as Dependabot PRs (docker-compose ecosystem).
name: ${COMPOSE_PROJECT_NAME:-fluxkit}

x-hardening: &hardening
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  init: true
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

# The API's environment: secrets and settings from the env file, plus the values the topology fixes. The storefront
# and the edge never see these.
x-api-environment: &api-environment
  NODE_ENV: production
  PORT: "3000"
  # URL-safe password (hex) so it can sit in the URL unescaped.
  DATABASE_URL: postgres://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
  # One proxy (the edge) sets X-Forwarded-For; with a CDN in front of it this becomes 2 (docs/deployment.md).
  TRUST_PROXY: ${TRUST_PROXY:?set TRUST_PROXY}
  STOREFRONT_PUBLIC_URL: https://${FLUXKIT_DOMAIN:?set FLUXKIT_DOMAIN}
  MEDIA_STORAGE_DRIVER: local
  MEDIA_DIR: /var/lib/fluxkit/media
  MEDIA_PUBLIC_BASE_URL: https://${FLUXKIT_DOMAIN:?set FLUXKIT_DOMAIN}/media
  # Read only with SEARCH_ENABLED=true (env file); a single-label host counts as a private address.
  MEILI_URL: http://meilisearch:7700

services:
  postgres:
    image: postgres:17.12-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    shm_size: 256mb
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Catalog search engine (Community Edition, MIT). The index is rebuilt from Postgres, so the volume is a cache, not a backup
  # target. Reachable only by the api on the Compose network: never publish its port or route it through the edge.
  meilisearch:
    <<: *hardening
    image: getmeili/meilisearch:v1.55.0@sha256:ff546679970126f8822e15d1b6a06bfbff1f2ce2e43f810cfb5258012f92de5c
    # The master key (MEILI_MASTER_KEY, SECRET, at least 16 bytes) lives in its own file, so the api never receives it: it
    # only creates the API's scoped key (docs/deployment.md). A missing file stops `up`.
    env_file: ["${FLUXKIT_MEILI_ENV_FILE:-meilisearch.env}"]
    environment:
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
      # Indexing memory stays below the container limit.
      MEILI_MAX_INDEXING_MEMORY: 512Mb
    volumes:
      - meili-data:/meili_data
    tmpfs: ["/tmp"]
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Shared state of the API instances (rate-limit windows and the mail pacer, multi-instance plan; read by the API with RATE_LIMIT_STORE=redis).
  # Counters only: nothing to persist or back up (no RDB, no AOF), keys carry a TTL and `volatile-ttl` evicts the closest to
  # expiry. Unmodified image under the approved AGPLv3 exception (docs/dependencies.md). Reachable only on the Compose network:
  # never publish its port or route it through the edge. Runs as the image's redis user (999) so no capability is needed.
  redis:
    <<: *hardening
    image: redis:8.12.0-alpine@sha256:5af80107c1eeecb484a2269b80a26d12bfa6521787da4663bd9f19f60a163483
    user: "999:999"
    # Hex password (openssl rand -hex 32), so it can later stand unescaped in REDIS_URL.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - volatile-ttl
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    tmpfs: ["/data:uid=999,gid=999"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Forward-only migrations before every start of the API (advisory lock: safe if two run at once). When it fails the
  # new api container is not started (docs/deployment.md, "Updates and migrations"); rollbacks are manual, so back up first.
  migrate:
    <<: *hardening
    image: ${FLUXKIT_IMAGE_PREFIX:-fluxkit}-api:${FLUXKIT_IMAGE_TAG:-latest}
    build:
      context: ..
      target: api
    restart: "no"
    command: ["node", "dist/database/migrate.js"]
    env_file: ["${FLUXKIT_ENV_FILE:-production.env}"]
    environment: *api-environment
    tmpfs: ["/tmp"]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *hardening
    labels:
      # Written by the deploy script; empty with manual Compose, so the next deploy rolls this service.
      com.fluxkit.release-digest: ${FLUXKIT_RELEASE_DIGEST:-}
    deploy:
      replicas: ${FLUXKIT_API_REPLICAS:-1}
    # Let HTTP requests drain before the scheduler, database and Redis close, before Docker sends SIGKILL.
    stop_grace_period: 30s
    image: ${FLUXKIT_IMAGE_PREFIX:-fluxkit}-api:${FLUXKIT_IMAGE_TAG:-latest}
    env_file: ["${FLUXKIT_ENV_FILE:-production.env}"]
    environment:
      <<: *api-environment
      # Stay in Docker DNS after the process stops accepting, so nginx can fail over before the address disappears.
      FLUXKIT_STOP_LINGER_SECONDS: "5"
    volumes:
      - media:/var/lib/fluxkit/media
    tmpfs: ["/tmp"]
    # Image uploads need about 512 MB above normal use (ADR 0028, README "Uploaded images").
    mem_limit: 1g
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      # Also with search off: a broken engine stops the boot instead of failing later (docs/deployment.md).
      meilisearch: { condition: service_healthy }
      # With RATE_LIMIT_STORE=redis the API refuses to start while Redis does not answer (ADR 0055), so a release that
      # recreates Redis must not start the API before it is healthy.
      redis: { condition: service_healthy }

  storefront:
    <<: *hardening
    labels:
      # Written by the deploy script; empty with manual Compose, so the next deploy rolls this service.
      com.fluxkit.release-digest: ${FLUXKIT_RELEASE_DIGEST:-}
    deploy:
      replicas: ${FLUXKIT_STOREFRONT_REPLICAS:-1}
    # Give Next time to finish requests in flight before Docker sends SIGKILL.
    stop_grace_period: 30s
    image: ${FLUXKIT_IMAGE_PREFIX:-fluxkit}-storefront:${FLUXKIT_IMAGE_TAG:-latest}
    build:
      context: ..
      target: storefront
      args:
        # Frozen into the CSP at build time; the same value is given at run time below.
        STOREFRONT_IMAGE_HOSTS: ${STOREFRONT_IMAGE_HOSTS:-}
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:3000
      STOREFRONT_PUBLIC_URL: https://${FLUXKIT_DOMAIN:?set FLUXKIT_DOMAIN}
      STOREFRONT_IMAGE_HOSTS: ${STOREFRONT_IMAGE_HOSTS:-}
      # Pass the edge's X-Forwarded-For on for the search window (ADR 0038); safe here because only the edge publishes ports.
      STOREFRONT_FORWARD_CLIENT_ADDRESS: ${STOREFRONT_FORWARD_CLIENT_ADDRESS:-false}
      STOREFRONT_DEMO_NOTICE: ${STOREFRONT_DEMO_NOTICE:-false}
      # Same DNS linger as the API. The migrator does not set this: it must exit as soon as it finishes.
      FLUXKIT_STOP_LINGER_SECONDS: "5"
    # Next's fetch and image caches (lost on restart, which is fine).
    tmpfs: ["/tmp", "/app/apps/storefront/.next/cache:uid=1000,gid=1000,mode=0755"]
    mem_limit: 1g
    depends_on:
      api: { condition: service_healthy }

  edge:
    <<: *hardening
    image: ${FLUXKIT_IMAGE_PREFIX:-fluxkit}-edge:${FLUXKIT_IMAGE_TAG:-latest}
    build:
      context: ..
      target: edge
    environment:
      FLUXKIT_DOMAIN: ${FLUXKIT_DOMAIN:?set FLUXKIT_DOMAIN}
      STOREFRONT_IMAGE_HOSTS: ${STOREFRONT_IMAGE_HOSTS:-}
    ports:
      - "${FLUXKIT_HTTP_PORT:-80}:8080"
      - "${FLUXKIT_HTTPS_PORT:-443}:8443"
    volumes:
      # fullchain.pem and privkey.pem, readable by uid 101 (docs/deployment.md, "TLS").
      - ${FLUXKIT_CERTS_DIR:?set FLUXKIT_CERTS_DIR}:/etc/nginx/certs:ro
      # Webroot for ACME http-01 challenges (certbot --webroot -w <this volume's path>), optional.
      - acme-webroot:/var/www/acme:ro
    # nginx renders its config into conf.d at start and keeps its pid and temp files in /tmp.
    tmpfs: ["/tmp:uid=101,gid=101", "/etc/nginx/conf.d:uid=101,gid=101"]
    depends_on:
      api: { condition: service_healthy }
      storefront: { condition: service_healthy }

volumes:
  postgres-data:
  meili-data:
  media:
  acme-webroot:
