# Production example: one host, one shop (docs/deployment.md). Not the development stack (that is docker-compose.yml).
#   cp infra/production.env.example infra/production.env      # fill in; never commit it
#   docker compose --env-file infra/production.env -f infra/docker-compose.prod.yml build
#   docker compose --env-file infra/production.env -f infra/docker-compose.prod.yml up -d --wait
# Services: postgres, migrate (runs the pending migrations, then exits), api (also runs the scheduler), storefront, edge
# (nginx: TLS, routing, the admin SPA). Only the edge publishes ports. Redis and Meilisearch are not part of it: no running
# code uses them yet (plan docs/plans/2026-10-29-production-deploy.md); they come with the search or queue plan.
# Run exactly ONE api replica: the rate limits, caches, mail pacing and the local media disk are per process.
name: ${COMPOSE_PROJECT_NAME:-fluxkit}

x-hardening: &hardening
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  init: true
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

# The API's environment: secrets and settings from the env file, plus the values the topology fixes. The storefront
# and the edge never see these.
x-api-environment: &api-environment
  NODE_ENV: production
  PORT: "3000"
  # URL-safe password (hex) so it can sit in the URL unescaped.
  DATABASE_URL: postgres://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
  # One proxy (the edge) sets X-Forwarded-For; with a CDN in front of it this becomes 2 (docs/deployment.md).
  TRUST_PROXY: ${TRUST_PROXY:?set TRUST_PROXY}
  STOREFRONT_PUBLIC_URL: https://${FLUXKIT_DOMAIN:?set FLUXKIT_DOMAIN}
  MEDIA_STORAGE_DRIVER: local
  MEDIA_DIR: /var/lib/fluxkit/media
  MEDIA_PUBLIC_BASE_URL: https://${FLUXKIT_DOMAIN:?set FLUXKIT_DOMAIN}/media

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    shm_size: 256mb
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Forward-only migrations before every start of the API (advisory lock: safe if two run at once). When it fails the
  # new api container is not started (docs/deployment.md, "Updates and migrations"); rollbacks are manual, so back up first.
  migrate:
    <<: *hardening
    image: ${FLUXKIT_IMAGE_PREFIX:-fluxkit}-api:${FLUXKIT_IMAGE_TAG:-latest}
    build:
      context: ..
      target: api
    restart: "no"
    command: ["node", "dist/database/migrate.js"]
    env_file: ["${FLUXKIT_ENV_FILE:-production.env}"]
    environment: *api-environment
    tmpfs: ["/tmp"]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *hardening
    image: ${FLUXKIT_IMAGE_PREFIX:-fluxkit}-api:${FLUXKIT_IMAGE_TAG:-latest}
    env_file: ["${FLUXKIT_ENV_FILE:-production.env}"]
    environment: *api-environment
    volumes:
      - media:/var/lib/fluxkit/media
    tmpfs: ["/tmp"]
    # Image uploads need about 512 MB above normal use (ADR 0028, README "Uploaded images").
    mem_limit: 1g
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  storefront:
    <<: *hardening
    image: ${FLUXKIT_IMAGE_PREFIX:-fluxkit}-storefront:${FLUXKIT_IMAGE_TAG:-latest}
    build:
      context: ..
      target: storefront
      args:
        # Frozen into the CSP at build time; the same value is given at run time below.
        STOREFRONT_IMAGE_HOSTS: ${STOREFRONT_IMAGE_HOSTS:-}
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:3000
      STOREFRONT_PUBLIC_URL: https://${FLUXKIT_DOMAIN:?set FLUXKIT_DOMAIN}
      STOREFRONT_IMAGE_HOSTS: ${STOREFRONT_IMAGE_HOSTS:-}
      # Pass the edge's X-Forwarded-For on for the search window (ADR 0038); safe here because only the edge publishes ports.
      STOREFRONT_FORWARD_CLIENT_ADDRESS: ${STOREFRONT_FORWARD_CLIENT_ADDRESS:-false}
    # Next's fetch and image caches (lost on restart, which is fine).
    tmpfs: ["/tmp", "/app/apps/storefront/.next/cache:uid=1000,gid=1000,mode=0755"]
    mem_limit: 1g
    depends_on:
      api: { condition: service_healthy }

  edge:
    <<: *hardening
    image: ${FLUXKIT_IMAGE_PREFIX:-fluxkit}-edge:${FLUXKIT_IMAGE_TAG:-latest}
    build:
      context: ..
      target: edge
    environment:
      FLUXKIT_DOMAIN: ${FLUXKIT_DOMAIN:?set FLUXKIT_DOMAIN}
      STOREFRONT_IMAGE_HOSTS: ${STOREFRONT_IMAGE_HOSTS:-}
    ports:
      - "${FLUXKIT_HTTP_PORT:-80}:8080"
      - "${FLUXKIT_HTTPS_PORT:-443}:8443"
    volumes:
      # fullchain.pem and privkey.pem, readable by uid 101 (docs/deployment.md, "TLS").
      - ${FLUXKIT_CERTS_DIR:?set FLUXKIT_CERTS_DIR}:/etc/nginx/certs:ro
      # Webroot for ACME http-01 challenges (certbot --webroot -w <this volume's path>), optional.
      - acme-webroot:/var/www/acme:ro
    # nginx renders its config into conf.d at start and keeps its pid and temp files in /tmp.
    tmpfs: ["/tmp:uid=101,gid=101", "/etc/nginx/conf.d:uid=101,gid=101"]
    depends_on:
      api: { condition: service_healthy }
      storefront: { condition: service_healthy }

volumes:
  postgres-data:
  media:
  acme-webroot:
