# Included by every location that goes to the API (/store, /admin, /media, /webhooks/payments). A location that sets
# any proxy_set_header inherits none from the server, so the whole set lives here.
proxy_pass http://fluxkit_api;
proxy_http_version 1.1;
proxy_set_header Connection "";
# Host, X-Forwarded-For and X-Forwarded-Proto: shared with the storefront location (ADR 0037). The CDN switch is made there.
include /etc/nginx/fluxkit/forwarded-headers.conf;
proxy_hide_header X-Powered-By;
# The edge owns HSTS (the API sends none today; this keeps it one header if it ever does).
proxy_hide_header Strict-Transport-Security;
