# Included by every location that goes to the API (/store, /admin, /media, /webhooks/payments). A location that sets
# any proxy_set_header inherits none from the server, so the whole set lives here.
proxy_pass http://fluxkit_api;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# REPLACE whatever the client sent with the address nginx saw: the API runs with TRUST_PROXY=1 and takes the last entry,
# so a client cannot choose its rate-limit key (ADR 0024, apps/api/src/rate-limit/trust-proxy.spec.ts). With a CDN in
# front, use $proxy_add_x_forwarded_for and TRUST_PROXY=2 instead (docs/deployment.md).
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_hide_header X-Powered-By;
# The edge owns HSTS (the API sends none today; this keeps it one header if it ever does).
proxy_hide_header Strict-Transport-Security;
