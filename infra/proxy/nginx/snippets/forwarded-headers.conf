# The request headers that tell the upstream who asked, for EVERY proxied location: the API ones (through proxy-to-api.conf)
# and the storefront (search UI review F2, ADR 0037). One place, because the storefront passes this X-Forwarded-For on to the
# API for the search window when STOREFRONT_FORWARD_CLIENT_ADDRESS=true: both paths must give the API the same chain.
# A location that sets any proxy_set_header inherits none from the server, so the includer must not set these itself
# (apps/api/src/payments/webhook/edge-proxy-config.spec.ts fails when one does).
proxy_set_header Host $host;
# REPLACE whatever the client sent with the address nginx saw: the API runs with TRUST_PROXY=1 and takes the last entry,
# so a client cannot choose its rate-limit key (ADR 0024, apps/api/src/rate-limit/trust-proxy.spec.ts). With a CDN or load
# balancer in front, use $proxy_add_x_forwarded_for here and TRUST_PROXY=2 instead (docs/deployment.md): this one line
# then covers the API and the storefront.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
