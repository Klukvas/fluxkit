packages:
  - "apps/*"
  - "packages/*"
  - "packages/features/*"
  - "packages/providers/*"
  - "seeds"

# Dependency install scripts are blocked by default. These two are explicitly ignored:
# @scarf/scarf is a telemetry package pulled in by swagger-ui-dist (AGENTS.md: no telemetry);
# msgpackr-extract is an optional native accelerator (BullMQ falls back to pure JS);
# @swc/core ships its binary via platform packages, its install script is only a fallback download.
ignoredBuiltDependencies:
  - "@scarf/scarf"
  - msgpackr-extract
  - "@swc/core"

# Security override (high advisory GHSA-q7qp-rjg7-q26m, multer < 2.5.0): @nestjs/platform-express pins multer 2.4.0 exactly,
# even in its latest release. The API uses no multipart upload (the media upload reads a raw body); remove this override as
# soon as @nestjs/platform-express depends on multer >= 2.5.0.
overrides:
  multer: 2.5.0
